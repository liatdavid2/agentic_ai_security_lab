services:
  blue-team:
    build:
      context: ./blue-team
    container_name: agentic-blue-team
    ports:
      - "8101:8101"
    restart: unless-stopped
    volumes:
      - benchmark-data:/shared
      - ./history:/history

  red-team:
    build:
      context: ./red-team
    container_name: agentic-red-team
    ports:
      - "8102:8102"
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - benchmark-data:/shared
      - jailbreakbench-data:/app/data
      - ./history:/history

volumes:
  benchmark-data:
  jailbreakbench-data:
