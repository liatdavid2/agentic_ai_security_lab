services:
  blue-team:
    build:
      context: ./blue-team
    container_name: agentic-blue-team
    ports:
      - "8101:8101"
    restart: unless-stopped
    volumes:
      - benchmark-data:/shared
      - ./history:/history

  red-team:
    build:
      context: ./red-team
    container_name: agentic-red-team
    ports:
      - "8102:8102"
    restart: unless-stopped
    environment:
      - OPENAI_API_URL=https://api.openai.com/v1
      - OPENAI_API_KEY_FILE=/run/secrets/openai_api_key
      - MAX_CONCURRENCY=10
      - JUDGE_MODEL=gpt-4.1
    volumes:
      - benchmark-data:/shared
      - jailbreakbench-data:/app/data
      - ./history:/history
      - ${OPENAI_SECRET_FILE:-./secrets/openai_api_key}:/run/secrets/openai_api_key:ro
  benchmark-data:
  jailbreakbench-data:
