services:
  blue-team:
    build: ./blue-team
    container_name: agentic-blue-team
    ports:
      - "8101:8101"
    restart: unless-stopped
    volumes:
      - benchmark-data:/shared
      - ./history:/history

  red-team:
    build: ./red-team
    container_name: agentic-red-team
    ports:
      - "8102:8102"
    restart: unless-stopped
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - BENCHMARK_LIMIT=${BENCHMARK_LIMIT:-20}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - benchmark-data:/shared
      - jailbreakbench-data:/app/data
      - ./history:/history

volumes:
  benchmark-data:
  jailbreakbench-data: